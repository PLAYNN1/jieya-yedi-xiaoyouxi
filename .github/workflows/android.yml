name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'audio/**', 'assets/**', 'index.html', 'preview.js', 'manifest.webmanifest', 'package.json', 'tools/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: yedi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
